[project]
name = "narrative-drift"
version = "0.1.0"
description = "Vane monitors Bluesky for narrative drift around OpenAI, Anthropic, and Google DeepMind."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Hazelime" }]
dependencies = []

[project.scripts]
vane = "vane.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
