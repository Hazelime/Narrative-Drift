name: Vane Narrative Report

on:
  schedule:
    - cron: "17 0 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Vane
        run: python -m pip install -e .

      - name: Run scheduled report
        if: github.event_name == 'schedule'
        env:
          BERGET_API_KEY: ${{ secrets.BERGET_API_KEY }}
        run: vane report --trigger scheduled

      - name: Run manual report
        if: github.event_name == 'workflow_dispatch'
        env:
          BERGET_API_KEY: ${{ secrets.BERGET_API_KEY }}
        run: vane report --trigger manual

      - name: Commit generated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports
          git diff --cached --quiet || git commit -m "Store Vane narrative report"
          git push
