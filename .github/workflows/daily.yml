name: Vane Daily Ingestion

on:
  schedule:
    - cron: "52 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Vane
        run: python -m pip install -e .

      - name: Run daily ingestion and summarization
        env:
          BERGET_API_KEY: ${{ secrets.BERGET_API_KEY }}
        run: vane daily

      - name: Commit generated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/snapshots
          git diff --cached --quiet || git commit -m "Store Vane daily snapshots"
          git push
